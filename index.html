<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SWEATER2HAND Tools</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SWEATER2HAND">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Sarabun:wght@400;500;600&display=swap');
  :root{
    color-scheme: light;
    --bg:#E3E7EC; --surface:#F8F6F0; --border:#DCD5C4; --text:#24262B; --text-muted:#6E7178;
    --ink:#2E3A75; --ink-contrast:#FDFCF9; --accent:#D49A16; --accent-ink:#1D1A12;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#14161B; --surface:#1E212A; --border:#333847; --text:#E8E9EE; --text-muted:#9297A3; --ink:#93A3EF; --ink-contrast:#14161B; color-scheme: dark; }
  }
  :root[data-theme="dark"]{ --bg:#14161B; --surface:#1E212A; --border:#333847; --text:#E8E9EE; --text-muted:#9297A3; --ink:#93A3EF; --ink-contrast:#14161B; color-scheme: dark; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:'Sarabun', system-ui, sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px 16px 40px;
  }
  .head{ text-align:center; max-width:420px; margin-bottom:22px; }
  .eyebrow{
    font-family:'Chakra Petch', sans-serif; font-size:12.5px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:var(--text-muted);
  }
  h1{ font-family:'Chakra Petch', sans-serif; font-weight:700; font-size:24px; margin:6px 0 0; }
  .tiles{
    display:flex; gap:14px; width:100%; max-width:640px;
    flex-direction:row;
  }
  @media (max-width:480px){ .tiles{ gap:10px; } }
  .tile{
    flex:1 1 0; min-width:0;
    background:var(--surface); border:1.5px solid var(--border); border-radius:18px;
    padding:22px 14px 20px; text-align:center; text-decoration:none; color:var(--text);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    box-shadow: 0 1px 2px rgba(30,30,40,.06), 0 10px 24px -12px rgba(30,30,40,.22);
    transition: transform .12s ease, border-color .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:active{ transform:scale(0.97); }
  .tile .icon{ font-size:40px; line-height:1; }
  .tile .name{ font-family:'Chakra Petch', sans-serif; font-weight:700; font-size:16px; line-height:1.3; }
  .tile .desc{ font-size:12.5px; color:var(--text-muted); line-height:1.5; }
  .tile.a{ border-color: color-mix(in srgb, var(--ink) 45%, var(--border)); }
  .tile.a .name{ color:var(--ink); }
  .tile.b{ border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .tile.b .name{ color:var(--accent); }
  .foot{ margin-top:24px; font-size:11.5px; color:var(--text-muted); text-align:center; }
</style></head>
<body>
  <div class="head">
    <p class="eyebrow">SWEATER2HAND · เครื่องมือภายใน</p>
    <h1>เลือกโปรแกรมที่จะใช้</h1>
  </div>
  <div class="tiles">
    <a class="tile a" href="tag.html">
      <span class="icon" aria-hidden="true">🏷️</span>
      <span class="name">ตัวรันป้ายไซส์</span>
      <span class="desc">กรอก Chest / Length / Price วัดตัวแล้วรันเลขอัตโนมัติ</span>
    </a>
    <a class="tile b" href="photo.html">
      <span class="icon" aria-hidden="true">📷</span>
      <span class="name">ป้ายไซส์ SWEATER2HAND</span>
      <span class="desc">ใส่ป้ายข้อมูลลงบนรูปเสื้อหลายตัวพร้อมกัน</span>
    </a>
  </div>
  <p class="foot">กรอกข้อมูลในตัวรันป้ายไซส์เสร็จแล้ว กด &ldquo;ส่งไปวางที่หน้าใส่รูป&rdquo; ได้เลยที่หน้าผลลัพธ์</p>
</body></html>
